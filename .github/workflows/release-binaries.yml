name: Release binaries

# Builds the per-ABI prebuilt extension binaries that phasync\ext\ensure_loaded()
# selects from (bin/phasync-<ver>-<ts>-<arch>-<libc>.so) and attaches them to the
# GitHub release on a v* tag. Run manually (workflow_dispatch) to smoke-test.
#
# glibc builds run inside the official php:X-cli image. musl builds do NOT use a
# `container:` — GitHub cannot run JavaScript actions (checkout, upload-artifact)
# inside an Alpine container on an arm64 runner — so those run on the glibc host
# and do the actual build inside `docker run … php:X-cli-alpine`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-glibc:
    name: PHP ${{ matrix.php }} ${{ matrix.arch }}-glibc
    runs-on: ${{ matrix.runner }}
    container: php:${{ matrix.php }}-cli
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        include:
          - { php: '8.3', runner: ubuntu-24.04,     arch: x86_64 }
          - { php: '8.4', runner: ubuntu-24.04,     arch: x86_64 }
          - { php: '8.5', runner: ubuntu-24.04,     arch: x86_64 }
          - { php: '8.3', runner: ubuntu-24.04-arm, arch: aarch64 }
          - { php: '8.4', runner: ubuntu-24.04-arm, arch: aarch64 }
          - { php: '8.5', runner: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - name: Install toolchain
        run: apt-get update && apt-get install -y --no-install-recommends $PHPIZE_DEPS git
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -eux
          phpize
          php build/gen_stub.php -f phasync.stub.php
          ./configure --enable-phasync
          make -j"$(nproc)"
          ART="phasync-${{ matrix.php }}-nts-$(uname -m)-glibc.so"
          cp modules/phasync.so "$ART"
          php -d extension="$PWD/$ART" -r 'exit(extension_loaded("phasync") ? 0 : 1);'
          echo "ART=$ART" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ART }}
          path: ${{ env.ART }}
          if-no-files-found: error

  build-musl:
    name: PHP ${{ matrix.php }} ${{ matrix.arch }}-musl
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', runner: ubuntu-24.04,     arch: x86_64 }
          - { php: '8.4', runner: ubuntu-24.04,     arch: x86_64 }
          - { php: '8.5', runner: ubuntu-24.04,     arch: x86_64 }
          - { php: '8.3', runner: ubuntu-24.04-arm, arch: aarch64 }
          - { php: '8.4', runner: ubuntu-24.04-arm, arch: aarch64 }
          - { php: '8.5', runner: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@v4    # on the glibc host, so JS actions work
      - name: Build in Alpine (musl)
        run: |
          set -eux
          docker run --rm -v "$PWD":/w -w /w "php:${{ matrix.php }}-cli-alpine" sh -euxc '
            apk add --no-cache $PHPIZE_DEPS >/dev/null
            phpize
            php build/gen_stub.php -f phasync.stub.php
            ./configure --enable-phasync
            make -j"$(nproc)"
            php -d extension="$PWD/modules/phasync.so" -r "exit(extension_loaded(\"phasync\") ? 0 : 1);"
          '
          ART="phasync-${{ matrix.php }}-nts-$(uname -m)-musl.so"
          cp modules/phasync.so "$ART"
          echo "ART=$ART" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ART }}
          path: ${{ env.ART }}
          if-no-files-found: error

  release:
    name: Attach binaries to release
    needs: [build-glibc, build-musl]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eux
          ls -l dist
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.so --clobber
