name: Release binaries

# Builds the per-ABI prebuilt extension binaries that phasync\ext\ensure_loaded()
# selects from (bin/phasync-<ver>-<ts>-<arch>-<libc>.so), and attaches them to the
# GitHub release on a v* tag. Run manually (workflow_dispatch) to smoke-test.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: PHP ${{ matrix.php }} ${{ matrix.target.arch }}-${{ matrix.target.libc }}
    runs-on: ${{ matrix.target.runner }}
    container: php:${{ matrix.php }}-cli${{ matrix.target.suffix }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        target:
          - { runner: ubuntu-24.04,     arch: x86_64,  libc: glibc, suffix: '' }
          - { runner: ubuntu-24.04,     arch: x86_64,  libc: musl,  suffix: '-alpine' }
          - { runner: ubuntu-24.04-arm, arch: aarch64, libc: glibc, suffix: '' }
          - { runner: ubuntu-24.04-arm, arch: aarch64, libc: musl,  suffix: '-alpine' }
    steps:
      # Toolchain first, because actions/checkout needs git in the container.
      # $PHPIZE_DEPS is defined by the official php images.
      - name: Install toolchain
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache $PHPIZE_DEPS git tar
          else
            apt-get update && apt-get install -y --no-install-recommends $PHPIZE_DEPS git
          fi

      - uses: actions/checkout@v4

      - name: Build
        run: |
          set -eux
          phpize
          # Regenerate arginfo for this exact PHP (ZEND_RAW_FENTRY arity changed in 8.4).
          php build/gen_stub.php -f phasync.stub.php
          ./configure --enable-phasync
          make -j"$(nproc)"
          ART="phasync-${{ matrix.php }}-nts-$(uname -m)-${{ matrix.target.libc }}.so"
          cp modules/phasync.so "$ART"
          php -d extension="$PWD/$ART" -r 'exit(extension_loaded("phasync") ? 0 : 1);'
          echo "ART=$ART" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ART }}
          path: ${{ env.ART }}
          if-no-files-found: error

  release:
    name: Attach binaries to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eux
          ls -l dist
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.so --clobber
