name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    services:
      # For tests/mysqlnd_suspends.phpt (skipped when PHASYNC_TEST_MYSQL is unset).
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=24
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: posix, mysqli, pdo_mysql, sockets
          tools: none
          coverage: none

      - name: Build
        run: |
          phpize
          ./configure --enable-phasync
          # The committed arginfo targets the latest PHP; force-regenerate it for
          # the PHP under test (the ZEND_RAW_FENTRY macro arity changed in 8.4).
          # -f is required: gen_stub skips when the stub hash is unchanged.
          php build/gen_stub.php -f phasync.stub.php
          make -j"$(nproc)"

      - name: Test
        env:
          NO_INTERACTION: '1'
          REPORT_EXIT_STATUS: '1'
          PHASYNC_TEST_MYSQL: '127.0.0.1:3306:root:test'
          TEST_PHP_ARGS: '--show-diff'
        run: make test TESTS=tests/

      - name: Dump failing test diffs
        if: failure()
        run: |
          for f in tests/*.out tests/*.diff tests/*.log; do
            [ -f "$f" ] && { echo "===== $f ====="; cat "$f"; }
          done || true
