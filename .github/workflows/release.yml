name: Release

# One-click release: builds the 12 per-ABI binaries, bundles them into a
# tag-only commit (so Packagist's tag tarball carries bin/ while main stays
# binary-free), pushes the tag, and publishes a GitHub release with the .so as
# assets. Run from the Actions tab with the version to cut.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.4.0-alpha1'
        required: true
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-glibc:
    name: build ${{ matrix.php }} ${{ matrix.arch }}-glibc
    runs-on: ${{ matrix.runner }}
    container: php:${{ matrix.php }}-cli
    strategy:
      fail-fast: true
      matrix:
        include:
          - { php: '8.3', runner: ubuntu-24.04,     arch: x86_64 }
          - { php: '8.4', runner: ubuntu-24.04,     arch: x86_64 }
          - { php: '8.5', runner: ubuntu-24.04,     arch: x86_64 }
          - { php: '8.3', runner: ubuntu-24.04-arm, arch: aarch64 }
          - { php: '8.4', runner: ubuntu-24.04-arm, arch: aarch64 }
          - { php: '8.5', runner: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - name: Install toolchain
        run: apt-get update && apt-get install -y --no-install-recommends $PHPIZE_DEPS git
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -eux
          phpize
          php build/gen_stub.php -f phasync.stub.php
          ./configure --enable-phasync
          make -j"$(nproc)"
          ART="phasync-${{ matrix.php }}-nts-$(uname -m)-glibc.so"
          cp modules/phasync.so "$ART"
          php -d extension="$PWD/$ART" -r 'exit(extension_loaded("phasync") ? 0 : 1);'
          echo "ART=$ART" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with: { name: "${{ env.ART }}", path: "${{ env.ART }}", if-no-files-found: error }

  build-musl:
    name: build ${{ matrix.php }} ${{ matrix.arch }}-musl
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { php: '8.3', runner: ubuntu-24.04,     arch: x86_64 }
          - { php: '8.4', runner: ubuntu-24.04,     arch: x86_64 }
          - { php: '8.5', runner: ubuntu-24.04,     arch: x86_64 }
          - { php: '8.3', runner: ubuntu-24.04-arm, arch: aarch64 }
          - { php: '8.4', runner: ubuntu-24.04-arm, arch: aarch64 }
          - { php: '8.5', runner: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@v4    # on the glibc host, so JS actions work
      - name: Build in Alpine (musl)
        run: |
          set -eux
          docker run --rm -v "$PWD":/w -w /w "php:${{ matrix.php }}-cli-alpine" sh -euxc '
            apk add --no-cache $PHPIZE_DEPS >/dev/null
            phpize
            php build/gen_stub.php -f phasync.stub.php
            ./configure --enable-phasync
            make -j"$(nproc)"
            php -d extension="$PWD/modules/phasync.so" -r "exit(extension_loaded(\"phasync\") ? 0 : 1);"
          '
          ART="phasync-${{ matrix.php }}-nts-$(uname -m)-musl.so"
          cp modules/phasync.so "$ART"
          echo "ART=$ART" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with: { name: "${{ env.ART }}", path: "${{ env.ART }}", if-no-files-found: error }

  publish:
    name: Bundle, tag & release
    needs: [build-glibc, build-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }

      - name: Refuse to overwrite an existing tag
        run: |
          if git ls-remote --tags origin "refs/tags/${{ inputs.version }}" | grep -q .; then
            echo "::error::Tag ${{ inputs.version }} already exists"; exit 1
          fi

      - name: Collect binaries into bin/
        uses: actions/download-artifact@v4
        with: { path: bin, merge-multiple: true }

      - name: Verify all 12 ABIs are present
        run: |
          set -eux
          n=$(ls bin/*.so | wc -l)
          test "$n" -eq 12 || { echo "::error::expected 12 binaries, got $n"; exit 1; }

      - name: Create tag-only release commit and tag
        run: |
          set -eux
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "__release-${{ inputs.version }}"
          git add -f bin/*.so
          git commit -m "Release ${{ inputs.version }}: bundle prebuilt binaries (12 ABIs)

          bin/ carries phasync-<ver>-nts-<arch>-<libc>.so for PHP 8.3/8.4/8.5 x
          {x86_64,aarch64} x {glibc,musl}. This commit lives only on the tag;
          main stays binary-free."
          git tag -a "${{ inputs.version }}" -m "phasync-ext ${{ inputs.version }}"
          git push origin "refs/tags/${{ inputs.version }}"

      - name: Publish GitHub release with binary assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          PRE=""
          [ "${{ inputs.prerelease }}" = "true" ] && PRE="--prerelease"
          gh release create "${{ inputs.version }}" $PRE \
            --title "${{ inputs.version }}" --generate-notes \
            bin/*.so
